/* Локальная версия: этот блок заменяет связь через claude.ai на связь через локальный сервер (server.py). */
(function(){
 var ID=(function(){try{var v=sessionStorage.getItem('svoya-cid');if(!v){v='c'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);sessionStorage.setItem('svoya-cid',v)}return v}catch(e){return 'c'+Math.random().toString(36).slice(2,12)}})();
 var peers=[],pcb=[],dbdocs={},dbsubs={},myP={},es=null;
 function post(u,b){var bd;return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:(bd=JSON.stringify(b)),keepalive:bd.length<60000}).then(function(r){return r.json()})}
 function snap(p){var d=dbdocs[p];return {exists:d!==undefined&&d!==null,data:function(){return d}}}
 function applyPeers(a){
  peers=a.map(function(p){return {id:p.id,presence:p.presence,updatedAt:p.updatedAt,isMe:p.id===ID,sameTab:p.id===ID,kind:'viewer'}});
  pcb.slice().forEach(function(f){try{f()}catch(x){}});
 }
 function applyDb(d){
  dbdocs=d;
  Object.keys(dbsubs).forEach(function(k){dbsubs[k].slice().forEach(function(f){try{f(snap(k))}catch(x){}})});
 }
 /* запасной канал: если поток событий (SSE) на хостинге задерживается, состояние всё равно приходит прямым запросом */
 var polling=0,pv=-1,dv=-1,pbusy=0;
 function startPoll(){
  if(polling)return;polling=1;
  setInterval(function(){
   if(pbusy)return;pbusy=1;
   fetch('/api/state?pv='+pv+'&dv='+dv,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(j.db&&j.dv!==dv){dv=j.dv;applyDb(j.db)}
    if(j.peers&&j.pv!==pv){pv=j.pv;applyPeers(j.peers)}
   }).catch(function(){}).then(function(){pbusy=0});
  },700);
 }
 function connect(){
  if(es)return;
  es=new EventSource('/api/events?id='+ID);
  es.addEventListener('peers',function(e){var v=+e.lastEventId;if(v&&v===pv)return;pv=v||pv;applyPeers(JSON.parse(e.data))});
  es.addEventListener('db',function(e){var v=+e.lastEventId;if(v&&v===dv)return;dv=v||dv;applyDb(JSON.parse(e.data))});
  startPoll();
  es.onopen=function(){pv=-1;dv=-1;if(Object.keys(myP).length)post('/api/presence',{id:ID,patch:myP}).catch(function(){})};
 }
 var room={
  peers:function(){return peers.slice()},
  onPeers:function(f){pcb.push(f);return function(){pcb=pcb.filter(function(x){return x!==f})}},
  presence:function(patch){Object.keys(patch).forEach(function(k){if(patch[k]===null)delete myP[k];else myP[k]=patch[k]});return post('/api/presence',{id:ID,patch:patch})}
 };
 var dbm={doc:function(path){return {
  onSnapshot:function(cb){(dbsubs[path]=dbsubs[path]||[]).push(cb);try{cb(snap(path))}catch(x){}return function(){dbsubs[path]=(dbsubs[path]||[]).filter(function(x){return x!==cb})}},
  set:function(data){return post('/api/db',{path:path,data:data})},
  get:function(){return Promise.resolve(snap(path))}
 }}};
 var dl={save:function(o){return new Promise(function(res,rej){try{
  var blob=(o.data instanceof Blob)?o.data:new Blob([o.data]);
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=o.filename||'file';document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},60000);res({ok:true});
 }catch(e){rej(e)}})}};
 window.claude={use:function(name){
  if(name==='room'){connect();return Promise.resolve(room)}
  if(name==='db'){connect();return Promise.resolve(dbm)}
  if(name==='downloads')return Promise.resolve(dl);
  return Promise.resolve(null);
 }};
 window.LANURLS=[];
 window.mediaUrl=function(id){return (window.__PRE&&window.__PRE[id])||'/media/'+id};
 window.lanText=function(){return window.LANURLS.length?'\uD83D\uDCF1 Телефонам: откройте '+window.LANURLS.join('   или   '):''};
 try{fetch('/api/info').then(function(r){return r.json()}).then(function(j){window.LANURLS=j.urls||[];window.__PUB=j.public||null;var e=document.getElementById('lanurl');if(e)e.textContent=window.lanText();var bx=document.getElementById('onlbox'),ux=document.getElementById('onlurl');if(bx&&ux&&window.__PUB){ux.textContent=window.__PUB;bx.style.display=''}}).catch(function(){})}catch(e){}
 setInterval(function(){if(es&&es.readyState===2){es=null;connect()}},10000);
 window.addEventListener('pagehide',function(ev){if(ev&&ev.persisted)return;try{navigator.sendBeacon('/api/leave',new Blob([JSON.stringify({id:ID})],{type:'application/json'}))}catch(e){}});
})();

let TT=null;
function typeQ(t){const el=$('qt');if(!el)return;clearInterval(TT);let i=0;el.textContent='';if(!t){if(!HOST.on)tmStart();return}TT=setInterval(()=>{i++;el.textContent=t.slice(0,i);if(i>=t.length){clearInterval(TT);if(!HOST.on)tmStart()}},30)}
function say(t){try{if(!window.speechSynthesis||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('ru'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function showOk(i){S.q.ok=i;S.cats[S.q.ci].qs[S.q.r].done=true;saveGame();tmStop();clearInterval(TT);try{speechSynthesis.cancel()}catch(e){}if(HOST.on){clearTimeout(HOST.lt);HOST.lk=0;HOST.open=false;pubHost()}
 const q=S.cats[S.q.ci].qs[S.q.r];
 $('mod').innerHTML=`<div class="ov" style="--mha:max(28vh,calc(100vh - 500px))"><div style="font-size:clamp(36px,7vw,72px);color:#2ecc71;font-weight:800">✓ ВЕРНО!</div><div class="meta" style="margin-top:10px;font-size:22px">${avTag(S.players[i].av,56)}${esc(S.players[i].name)} +${V[S.q.r]}</div><div class="a" style="margin:18px 0">${ansHtml(q,false)}</div><div class="host-only" style="margin:0 0 22px;font-size:20px"><div style="color:#9fb0ff;margin-bottom:8px">Дополнительные баллы (например, за устный вопрос)</div><select id="bp" style="font-size:20px;padding:8px;border-radius:8px">${S.players.map((p,k)=>`<option value="${k}" ${k===i?'selected':''}>${esc(p.name)}</option>`).join('')}</select> <input id="bv" type="number" step="50" min="0" value="${V[0]}" style="font-size:20px;padding:8px;width:110px;border-radius:8px"> <button class="ok" onclick="bonus(1)">+ Добавить</button> <button class="bad" onclick="bonus(-1)">− Снять</button><div id="bl" style="margin-top:8px;color:#ffd54a"></div></div><button class="ok" style="font-size:22px;padding:14px 28px" onclick="closeQ(true)">Продолжить</button></div>`}
function bonus(sg){const k=+$('bp').value,v=Math.abs(parseInt($('bv').value,10)||0);if(!v||!S.players[k])return;S.players[k].score+=sg*v;saveGame();sfx(sg>0?1:0);pubHost();const l=$('bl');if(l)l.textContent+=(l.textContent?'   ':'')+S.players[k].name+' '+(sg>0?'+':'−')+v+' (итого '+S.players[k].score+')'}
function showA(){tmStop();const e=$('tm');if(e)e.textContent='';S.q.show=true;$('ans').style.display='block';$('showb').style.display='none';{const cq=S.cats[S.q.ci].qs[S.q.r],ms=$('mslot');if(ms&&cq.am&&cq.am.type!=='audio')ms.style.display='none'}pubHost()}
let OPENING=false;
async function openQ(ci,r){if(S.q||OPENING)return;OPENING=true;try{const q=S.cats[ci].qs[r];if(q.m)await loadM(q.m.id);if(q.am)await loadM(q.am.id);if(ONLINE&&HOST.on&&window.mediaUrl){await upMedia(q.m);await upMedia(q.am)}S.q={ci,r,show:false,wrong:[]};VQ++;VT=0;if(HOST.on&&RM&&holdPeers().length)startHold();else releaseQ()}finally{OPENING=false}}
/* Вопрос показывается, только когда сигнал дошёл до всех подключённых экранов зрителей и телефонов (или истекло время ожидания) */
let HOLD={};
function holdPeers(){return RM?RM.peers().filter(p=>!p.sameTab&&p.presence&&(p.presence.role==='viewer'||(p.presence.role==='player'&&p.presence.pname))):[]}
function holdItems(){const ps=holdPeers(),nv=ps.filter(p=>p.presence.role==='viewer').length;let vi=0;return ps.map(p=>({ok:p.presence.ack===HOST.hid,t:p.presence.role==='viewer'?'🖥 Экран зрителя'+(nv>1?' '+(++vi):''):'📱 '+p.presence.pname}))}
function startHold(){HOST.hd=1;HOST.hid=Math.random().toString(36).slice(2,8);HOLD.t0=Date.now();pubHost();
 const d=document.createElement('div');d.id='hold';d.className='ov';d.style.zIndex=40;
 d.innerHTML='<div class="q" style="font-size:clamp(22px,4vw,34px)">Передаю вопрос участникам…</div><div id="holdl" style="font-size:24px;margin:16px;line-height:1.8"></div><div class="btns"><button class="ok" onclick="releaseQ()">Показать сейчас</button><button class="sec" onclick="cancelHold()">Отмена</button></div>';
 document.body.appendChild(d);clearTimeout(HOLD.to);HOLD.to=setTimeout(()=>{if(HOST.hd)releaseQ()},15000);holdCheck()}
function holdCheck(){if(!HOST.hd)return;const it=holdItems();if(!it.length||it.every(x=>x.ok)){releaseQ();return}
 const e=$('holdl');if(e)e.innerHTML=it.map(x=>(x.ok?'<span style="color:#2ecc71">✓ ':'<span style="color:#ffd54a">⏳ ')+esc(x.t)+'</span>').join('<br>')+'<div style="font-size:16px;color:#9fb0ff;margin-top:8px">Ждём: '+it.filter(x=>!x.ok).length+' из '+it.length+'</div>'}
function releaseQ(){clearTimeout(HOLD.to);const h=$('hold');if(h)h.remove();if(!S.q)return;HOST.hd=0;const q=S.cats[S.q.ci].qs[S.q.r];$('mod').innerHTML=modal();typeQ(q.q);if(S.voice)say(q.q);hostOpen()}
function cancelHold(){clearTimeout(HOLD.to);const h=$('hold');if(h)h.remove();HOST.hd=0;S.q=null;hostClose()}
function modal(){
 const {ci,r,show,wrong}=S.q;const c=S.cats[ci],q=c.qs[r],v=V[r];
 return `<div class="ov"><div class="meta" style="font-size:clamp(16px,2vw,30px)">${esc(c.name)} — ${v}</div><div class="q" id="qt"></div><div id="mslot">${mediaHtml(q)}</div><div id="win" style="font-size:30px;color:#2ecc71;margin:6px 0"></div><div id="tm" onclick="tmStart()" title="Нажмите, чтобы запустить заново" style="font-size:clamp(44px,6vw,90px);font-weight:800;color:#ffd54a;margin:4px 0;cursor:pointer"></div><div style="margin:8px"><button class="sec" onclick="say(S.cats[S.q.ci].qs[S.q.r].q)">🔊 Озвучить</button></div>`+
 `<div class="a" id="ans" style="display:none">${ansHtml(q,true)}</div><button id="showb" onclick="showA()">Показать ответ</button>`+
 `<div class="ctl-sp" style="height:190px;flex:none"></div><div class="ctl"><div class="score" style="margin-top:20px">`+S.players.map((p,i)=>`<div class="pl" style="cursor:default">${avTag(p.av,36)}${esc(p.name)}<div class="row" style="justify-content:center"><button class="ok" id="b${i}" onclick="ans(${i},1)">✓ +${v}</button><button class="bad" id="c${i}" onclick="ans(${i},0)">✕ −${v}</button></div></div>`).join('')+`</div>
 <div class="btns"><button class="sec" onclick="closeQ(true)">Никто не ответил</button><button class="sec" onclick="closeQ(false)">Отмена (вернуть вопрос)</button><button class="bad" onclick="askEmergency()">⛔ Экстренно завершить игру</button></div></div></div>`;
}
function ans(i,ok){const v=V[S.q.r];
 if(ok){sfx(1);S.players[i].score+=v;S.cur=i;showOk(i)}
 else{sfx(0);S.players[i].score-=v;S.q.wrong.push(i);$('b'+i).disabled=true;$('c'+i).disabled=true;saveGame();hostWrong(S.players[i].name)}}
function closeQ(done){if(done)S.cats[S.q.ci].qs[S.q.r].done=true;S.q=null;tmStop();hostClose();clearInterval(TT);try{speechSynthesis.cancel()}catch(e){}$('mod').innerHTML='';
 if(S.cats.every(c=>c.qs.every(q=>q.done||(!q.q.trim()&&!q.m))))endRound();else render()}
function inter(){
 const s=[...S.players].sort((a,b)=>b.score-a.score);
 return `<div style="zoom:.6">${TTL()}</div>`+`<h1>Итоги ${S.ri+1} раунда</h1><div class="center" style="text-align:center">`+s.map((p,i)=>`<div class="res">${i===0?'🥇 ':(i+1)+'. '}${avTag(p.av,40)}${esc(p.name)} — <b style="color:var(--gold)">${p.score}</b></div>`).join('')+`<div class="btns"><button onclick="nextRound()">Раунд ${S.ri+2} ▶</button><button class="bad" onclick="askEmergency()">⛔ Экстренно завершить</button></div></div>`;
}
function nextRound(){HOST.pm=null;S.ri++;S.intro=true;go('board');setTimeout(preUp,1500)}
function endRound(){go(S.ri<S.rounds.length-1?'inter':'final')}
function final(){
 const s=[...S.players].sort((a,b)=>b.score-a.score);
 return `<h1>ИТОГИ</h1><div class="center" style="text-align:center">`+s.map((p,i)=>`<div class="res">${i===0?'🏆 ':(i+1)+'. '}${esc(p.name)} — <b style="color:var(--gold)">${p.score}</b></div>`).join('')+`<div class="btns"><button onclick="start()">Играть ещё раз</button><button class="sec" onclick="endGame()">В меню</button></div></div>`;
}
function editor(){
 let h=`<h1>РЕДАКТОР ВОПРОСОВ</h1><div style="text-align:center;color:#9fb0ff;margin-bottom:8px">📎 — файл к вопросу, ✓📎 — файл к ответу</div><div class="btns"><button class="sec" onclick="go('setup')">← В меню</button></div><div class="btns">`+S.rounds.map((_,i)=>`<button class="${i===S.ei?'':'sec'}" onclick="S.ei=${i};render()">Раунд ${i+1}</button>`).join('')+`<button class="ok" onclick="addRound()">+ Раунд</button><button class="bad" onclick="delRound()" ${S.rounds.length<2?'disabled':''}>− Раунд ${S.ei+1}</button></div><div class="btns"><button onclick="addCat()">+ Категория в раунд ${S.ei+1}</button></div>`;
 S.cats.forEach((c,ci)=>{
  h+=`<div class="ed"><div class="row"><input value="${esc(c.name)}" placeholder="Название категории" oninput="S.cats[${ci}].name=this.value;save()"><button class="bad" onclick="delCat(${ci})" ${S.cats.length<2?'disabled':''}>Удалить</button></div>`;
  c.qs.forEach((q,r)=>h+=`<div class="qr"><b style="color:var(--gold)">${V[r]}</b><input value="${esc(q.q)}" placeholder="Вопрос" oninput="S.cats[${ci}].qs[${r}].q=this.value;save()"><input value="${esc(q.a)}" placeholder="Ответ" oninput="S.cats[${ci}].qs[${r}].a=this.value;save()"><div>${mediaCell(ci,r,q)}</div><div>${mediaCell(ci,r,q,'am')}</div></div>`);
  h+=`</div>`});
 h+=`<div class="ed"><b>Перенос на другое устройство</b><div class="btns"><button onclick="saveLib()">💾 Сохранить библиотеку в файл (с медиа)</button><button class="sec" onclick="this.nextElementSibling.click()">📂 Загрузить из файла</button><input type="file" hidden accept=".json,application/json" onchange="loadLib(this)"></div><div style="color:#9fb0ff;margin-top:6px">Или через код (только текст, без медиа):</div><div class="btns"><button class="sec" onclick="exp()">Показать код вопросов</button><button class="sec" onclick="imp()">Загрузить из кода</button></div><textarea id="io" rows="4" placeholder="Сюда попадёт код. Чтобы загрузить — вставьте код и нажмите «Загрузить из кода»"></textarea></div>`;
 return h;
}
function addRound(){S.rounds.push([mk('Категория 1',[]),mk('Категория 2',[]),mk('Категория 3',[])]);S.ei=S.rounds.length-1;save();render()}
function delRound(){ask('Удалить раунд '+(S.ei+1)+' вместе со всеми его вопросами?',()=>{S.rounds.splice(S.ei,1);S.ei=Math.max(0,S.ei-1);save();render()})}
function addCat(){S.cats.push(mk('Новая категория',[]));save();render()}
function delCat(i){ask('Удалить категорию?',()=>{S.cats.splice(i,1);save();render()})}
function exp(){$('io').value=JSON.stringify(S.rounds.map(r=>r.map(c=>({name:c.name,qs:c.qs.map(q=>({q:q.q,a:q.a,done:false}))}))));$('io').select()}
function imp(){try{const o=JSON.parse($('io').value);if(!Array.isArray(o)||!o.length)throw 0;S.rounds=Array.isArray(o[0])?o:[o];S.ei=0;save();render()}catch(e){note('Не получилось прочитать код')}}
render();
</script></body></html>
